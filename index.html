<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1924">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Powder Keg 1914</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;600;700;800;900&family=Special+Elite&display=swap">
<style>
/* ===== base.css ===== */
/* Layout: one-screen app. Canvas battlefield underneath; DOM HUD, menu screens and "telegram" paper modals stacked above it. */
:root{
  color-scheme:dark;
  /* atlas-ink surfaces */
  --ink:#0c1924; --ink-2:#132737; --ink-3:#1b3850; --line:#2c5475;
  --fg:#f6eedb; --fg-mute:#9db4c6;
  /* telegram paper */
  --paper:#f4e7c6; --paper-2:#e7d6aa; --paper-line:#cbb682; --paper-ink:#2a2017; --paper-mute:#705e47;
  /* accents */
  --stamp:#e4472c; --brass:#f2bb3d; --brass-ink:#3a2a05; --good:#38b876; --bad:#ee4f4f;
  /* cause colours: M.A.I.N. + Spark + "not a cause" (x) — use these EVERYWHERE a cause is shown */
  --c-m:#a3b85e; --c-a:#4da8ff; --c-i:#b77dff; --c-n:#ff5e4f; --c-s:#ffa01f; --c-x:#8fa0ad;
  --font-display:'Alfa Slab One','Rockwell','Georgia',serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-type:'Special Elite','Courier New',monospace;
  --r:14px; --r-sm:9px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;
  overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#game-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud,#screens,#modals,#toasts{position:absolute;inset:0;pointer-events:none}
#hud{z-index:10} #screens{z-index:20} #modals{z-index:30} #toasts{z-index:40}

/* ---- full-screen pages (menus, codex, practice test) ---- */
.screen{position:absolute;inset:0;pointer-events:auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-block:20px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);
  background:var(--ink);display:flex;flex-direction:column;align-items:center}
.screen>.wrap{width:100%;max-width:920px;display:flex;flex-direction:column;gap:16px;margin-block:auto}
/* ---- modal: dim veil + centred card ---- */
.veil{position:absolute;inset:0;pointer-events:auto;background:rgba(6,13,20,.8);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-block:16px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.modal{width:100%;max-width:640px;margin-block:auto;border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.paper{background:
    repeating-linear-gradient(0deg,rgba(120,90,40,.045) 0 1px,transparent 1px 4px),
    linear-gradient(180deg,var(--paper),var(--paper-2));
  color:var(--paper-ink);border:2px solid var(--paper-line)}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* ---- type ---- */
.display{font-family:var(--font-display);font-weight:400;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--font-type);text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;color:var(--fg-mute)}
.paper .eyebrow{color:var(--paper-mute)}
.mute{color:var(--fg-mute)} .paper .mute{color:var(--paper-mute)}
.num{font-variant-numeric:tabular-nums}
.stamp{display:inline-block;font-family:var(--font-type);text-transform:uppercase;letter-spacing:.12em;
  color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:.25em .6em .1em;transform:rotate(-3deg)}

/* ---- buttons ---- */
.btn{font:800 1rem/1.1 var(--font-body);padding:.8em 1.2em;border-radius:12px;border:2px solid var(--line);
  background:var(--ink-3);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:44px;text-align:center;transition:transform .08s,filter .15s,box-shadow .08s;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn.primary{background:var(--brass);border-color:#ffdc82;color:var(--brass-ink)}
.btn.danger{background:var(--stamp);border-color:#ff9078;color:#fff}
.btn.good{background:var(--good);border-color:#7fe0b0;color:#04240f}
.btn.ghost{background:transparent;box-shadow:none}
.btn.big{font-size:1.3rem;padding:.9em 1.6em;border-radius:16px}
.btn.small{font-size:.85rem;padding:.5em .8em;min-height:36px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.paper .btn{background:#fff8e3;border-color:var(--paper-line);color:var(--paper-ink);box-shadow:0 4px 0 rgba(90,60,20,.3)}
.paper .btn.primary{background:var(--brass);border-color:#b98a12;color:var(--brass-ink)}

/* ---- small parts ---- */
.pill{display:inline-flex;align-items:center;gap:.35em;font-weight:800;font-size:.8rem;line-height:1;padding:.35em .7em;border-radius:999px;background:var(--ink-3);color:var(--fg)}
.pill.m{background:var(--c-m);color:#1c2408} .pill.a{background:var(--c-a);color:#04213f}
.pill.i{background:var(--c-i);color:#230a45} .pill.n{background:var(--c-n);color:#3d0700}
.pill.s{background:var(--c-s);color:#3d2200} .pill.x{background:var(--c-x);color:#101a22}
.bar{height:12px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--brass);border-radius:inherit;transition:width .4s}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,var(--brass) 55%,#a87708);vertical-align:-.12em;box-shadow:inset 0 0 0 1.5px #8a6205}
kbd,.kbd{font-family:var(--font-type);font-size:.8em;background:rgba(0,0,0,.25);border:1px solid currentColor;border-radius:5px;padding:.05em .4em;opacity:.8}

/* ---- motion ---- */
@keyframes pop-in{from{transform:scale(.92) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop-in{animation:pop-in .22s cubic-bezier(.2,1.3,.5,1) both}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .35s}
@keyframes toast-in{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
#toasts{display:flex;flex-direction:column;align-items:center;gap:8px;padding:64px 16px 0}
.toast{background:var(--ink-3);border:2px solid var(--brass);color:var(--fg);padding:.6em 1em;border-radius:12px;font-weight:800;
  box-shadow:var(--shadow);animation:toast-in .25s both;max-width:min(520px,100%);text-align:center}
.toast.good{border-color:var(--good)} .toast.bad{border-color:var(--bad)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== game.css ===== */
/* game.css — in-run HUD, banners, upgrade picker, pause. (lead) */
html{box-sizing:border-box}
#hud{font-family:var(--font-body);color:var(--fg)}
.hud-top{position:absolute;left:0;right:0;top:0;padding-top:8px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;flex-direction:column;gap:6px}
.hud-xp{position:relative;height:17px;border-radius:999px;background:rgba(0,0,0,.55);border:1.5px solid var(--line);overflow:hidden}
.hud-xp>i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#34c9b7,#58b4ff);transition:width .15s}
.hud-lv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 .66rem/1 var(--font-body);letter-spacing:.14em;text-shadow:0 1px 2px #000}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hud-left{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;max-width:300px}
.hud-hp{position:relative;height:20px;border-radius:8px;background:rgba(0,0,0,.55);border:1.5px solid var(--line);overflow:hidden}
.hud-hp>i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#5fe39a,#2a9d62);transition:width .12s}
.hud-hp>i.low{background:linear-gradient(180deg,#ff8a7a,#dd3527)}
.hud-hp>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 .72rem/1 var(--font-body);text-shadow:0 1px 2px #000}
.hud-actrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hud-main{display:flex;gap:3px}
.hud-main span{width:23px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:400 .8rem/1 var(--font-display);background:rgba(0,0,0,.5);color:var(--fg-mute);border:1.5px solid transparent}
.hud-main span.k-m{--kc:var(--c-m)} .hud-main span.k-a{--kc:var(--c-a)} .hud-main span.k-i{--kc:var(--c-i)} .hud-main span.k-n{--kc:var(--c-n)} .hud-main span.k-s{--kc:var(--c-s)}
.hud-main span.done{background:var(--kc);color:#0c1924}
.hud-main span.now{border-color:var(--kc);color:var(--kc);animation:hud-pulse .8s infinite alternate}
@keyframes hud-pulse{from{transform:scale(1)}to{transform:scale(1.14)}}
.hud-act{font:900 .68rem/1 var(--font-body);letter-spacing:.1em;text-shadow:0 1px 3px #000}
.hud-right{display:flex;align-items:flex-start;gap:8px;flex:none}
.hud-stats{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font:900 .8rem/1.1 var(--font-body);text-shadow:0 1px 3px #000}
.hud-time{font-size:1.1rem}
.hud-coin{display:inline-flex;align-items:center;gap:4px}
.hud-kill{color:var(--fg-mute);font-size:.7rem;letter-spacing:.06em}
.hud-pause{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:rgba(19,39,55,.88);display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0}
.hud-pause i{width:5px;height:16px;background:var(--fg);border-radius:2px}
.hud-pause:focus-visible{outline:3px solid var(--brass)}
.hud-boss{align-self:center;width:min(520px,100%);text-align:center}
.hud-boss-n{font-size:.95rem;color:var(--bc,var(--stamp));text-shadow:0 2px 0 #000}
.hud-boss-bar{height:14px;border-radius:8px;background:rgba(0,0,0,.6);border:2px solid var(--bc,var(--stamp));overflow:hidden;margin-top:3px}
.hud-boss-bar>i{display:block;height:100%;width:100%;background:var(--bc,var(--stamp));transition:width .12s}
.hud-boss-bar>i.sh{background:repeating-linear-gradient(45deg,#7fe3ff 0 8px,#d9f7ff 8px 16px)}
.hud-fuse{display:flex;align-items:center;gap:6px;margin-top:4px;font:900 .62rem/1 var(--font-body);letter-spacing:.14em;color:var(--c-s)}
.hud-fuse>div{flex:1;height:6px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden}
.hud-fuse i{display:block;height:100%;background:var(--c-s)}
.hud-banner{--bc:var(--brass);position:absolute;left:50%;top:150px;width:min(560px,calc(100% - 32px));margin-left:calc(min(560px,100% - 32px) / -2);
  display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:rgba(9,18,27,.88);border:2px solid var(--bc);box-shadow:var(--shadow)}
.hud-banner.in{animation:hb-in .35s cubic-bezier(.2,1.3,.5,1) both}
@keyframes hb-in{from{transform:translateY(-16px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.hb-big{flex:none;width:56px;height:56px;border-radius:12px;background:var(--bc);color:#0c1924;font-size:2rem;display:flex;align-items:center;justify-content:center}
.hb-txt{min-width:0}
.hb-t{font-size:1.12rem;color:var(--bc)}
.hb-s{font-size:.88rem;font-weight:700;line-height:1.3;margin-top:3px}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.hud-weps{display:flex;flex-wrap:wrap;gap:5px;max-width:72%}
.hw{position:relative;width:31px;height:31px;border-radius:8px;background:rgba(9,18,27,.78);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.95rem}
.hw b{position:absolute;right:-4px;bottom:-4px;font:900 .6rem/1 var(--font-body);background:var(--brass);color:var(--brass-ink);border-radius:5px;padding:1px 3px}
.hw.pas{border-style:dashed}
.hud-streak{font:900 .68rem/1 var(--font-body);letter-spacing:.1em;color:var(--brass-ink);background:var(--brass);padding:.5em .75em;border-radius:999px;white-space:nowrap}

/* ---- upgrade picker / pause / confirm ---- */
.pk-pick .modal,.pk-pause .modal,.pk-confirm .modal{max-width:780px;display:flex;flex-direction:column;gap:12px}
.pk-confirm .modal,.pk-pause .modal{max-width:520px}
.pk-h{font-size:clamp(1.4rem,5vw,2rem);color:var(--brass)}
.pk-p{margin:0;font-weight:700}
.pk-cards{display:grid;gap:10px;grid-template-columns:1fr}
.pk-card{--kc:var(--c-x);position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);
  background:var(--ink-3);color:var(--fg);cursor:pointer;min-height:64px;transition:transform .08s,border-color .15s,background .15s;box-shadow:0 4px 0 rgba(0,0,0,.35);font-family:var(--font-body)}
.pk-card:hover,.pk-card:focus-visible{border-color:var(--kc);transform:translateY(-2px);outline:none;filter:brightness(1.15)}
.pk-card:active{transform:translateY(2px)}
.pk-card.k-m{--kc:var(--c-m)} .pk-card.k-a{--kc:var(--c-a)} .pk-card.k-i{--kc:var(--c-i)} .pk-card.k-n{--kc:var(--c-n)} .pk-card.k-s{--kc:var(--c-s)}
.pk-ic{flex:none;width:46px;height:46px;border-radius:12px;background:rgba(0,0,0,.3);border:2px solid var(--kc);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.pk-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.pk-lv{font:900 .66rem/1 var(--font-body);letter-spacing:.12em;color:var(--kc)}
.pk-card.new .pk-lv{color:var(--brass)}
.pk-nm{font:400 1.05rem/1.1 var(--font-display)}
.pk-ds{font-weight:700;font-size:.9rem;line-height:1.3}
.pk-hk{font-size:.78rem;line-height:1.3;color:var(--fg-mute);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.pk-key{position:absolute;right:8px;top:8px;font:400 .7rem/1 var(--font-type);opacity:.55;border:1px solid currentColor;border-radius:4px;padding:3px 5px 1px}
@media (hover:none){.pk-key{display:none}}
@media (min-width:720px){
  .pk-cards.n2{grid-template-columns:repeat(2,1fr)} .pk-cards.n3{grid-template-columns:repeat(3,1fr)} .pk-cards.n4{grid-template-columns:repeat(4,1fr)}
  .pk-cards.n3 .pk-card,.pk-cards.n4 .pk-card,.pk-cards.n2 .pk-card{flex-direction:column;align-items:stretch}
}
.pk-tip{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:10px 14px}
.pk-tip .eyebrow{color:var(--paper-mute)}
.pk-tip p{margin:4px 0 0;font-weight:700}
.pk-build{display:flex;flex-wrap:wrap;gap:6px}
.pk-build span{background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:.3em .7em;font-size:.82rem;font-weight:700}
.pk-build b{color:var(--brass)}

/* ===== quiz.css ===== */
/* quiz.css — question telegram, bonus rounds, practice test, study notes. Builds on base.css tokens. */
:root{
  --good-ink:#1b7a48; --bad-ink:#b3301b; --good-soft:#c9efd8; --bad-soft:#f9d2ca;
  --paper-hi:#fff8e3; --paper-shade:rgba(90,60,20,.16); --brass-line:#b98a12;
  --side-allied:#1c8f86; --side-central:#3b3027;
}
[hidden]{display:none!important}
.qz-veil{z-index:5}
.paper .stamp.good{color:var(--good-ink);border-color:var(--good-ink)}
.paper .stamp.bad{color:var(--bad-ink);border-color:var(--bad-ink)}
.paper .bar{background:var(--paper-shade)}

/* ---------- question modal ---------- */
.qz,.bz{display:flex;flex-direction:column;gap:14px;padding:18px;outline:none}
.qz-head{display:flex;flex-direction:column;gap:4px}
.qz-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.qz-header{font-size:clamp(1.05rem,4.3vw,1.4rem)}
.qz-sub{font-size:.9rem}
.qz-pill{flex:none;white-space:nowrap}
.qz-ctx-boss .qz-header,.qz-ctx-revive .qz-header{color:var(--bad-ink)}
.qz-timer{height:10px}
.qz-timer>i{transition:width .12s linear}
.qz-timer.hot>i{background:var(--stamp)}
.qz-q{font-size:clamp(1.12rem,4.6vw,1.45rem);font-weight:800;line-height:1.3;text-wrap:pretty}
.qz-choices{display:grid;gap:10px}
.qz-choices.two{grid-template-columns:1fr 1fr}
.qz-choices.two .qz-choice{justify-content:center;text-align:center}
.qz-choice,.bz-opt,.bz-chain-item{width:100%;justify-content:flex-start;text-align:left;font-size:1.02rem;line-height:1.25;padding:.7em .8em;min-height:54px}
.qz-choice-text{min-width:0;overflow-wrap:anywhere}
.qz-key,.bz-num{flex:none;display:grid;place-items:center;width:1.7em;height:1.7em;border:1.5px solid currentColor;border-radius:6px;
  font-family:var(--font-type);font-size:.85em;line-height:1;padding-top:.15em;opacity:.7}
.paper .btn.is-right,.paper .btn.is-wrong,.paper .btn.is-picked{opacity:1;filter:none}
.paper .btn.is-right{background:var(--good-soft);border-color:var(--good-ink);color:var(--paper-ink)}
.paper .btn.is-wrong{background:var(--bad-soft);border-color:var(--bad-ink);color:var(--paper-ink)}
.paper .btn.is-picked{background:var(--brass);border-color:var(--brass-line);color:var(--brass-ink)}
.paper .btn.is-dim{opacity:.4}
.qz-feedback{display:flex;flex-direction:column;gap:10px;border-top:2px dashed var(--paper-line);padding-top:14px}
.qz-verdict{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qz-verdict .stamp{font-size:1.15rem}
.qz-streak{font-family:var(--font-type);font-size:.9rem;color:var(--paper-mute)}
.qz-answer{display:flex;flex-direction:column;gap:2px}
.qz-answer b{font-size:1.12rem;color:var(--good-ink)}
.qz-explain{font-size:1rem;line-height:1.42}
.qz-continue{width:100%}

@media (max-width:420px){.qz-choices.two .qz-key{display:none}}
@media (max-height:700px){
  .qz,.bz{gap:10px;padding:14px}
  .qz-sub{display:none}
  .qz-choice,.bz-opt,.bz-chain-item{min-height:48px;font-size:.97rem;padding:.55em .7em}
  .bz-card{min-height:84px;padding:12px}
}

/* ---------- bonus rounds ---------- */
.bz-head{display:flex;flex-direction:column;gap:4px}
.bz-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bz-prog{font-family:var(--font-type);font-size:.95rem;color:var(--paper-mute)}
.bz-title{font-size:clamp(1.35rem,6.2vw,2rem)}
.bz-sub{font-size:.95rem}
.bz-body{display:flex;flex-direction:column;gap:12px}
.bz-card{background:var(--paper-hi);border:2px solid var(--paper-line);border-radius:12px;padding:16px;text-align:center;min-height:104px;
  display:flex;flex-direction:column;justify-content:center;gap:6px;transition:background .15s,border-color .15s}
.bz-card-text{font-size:1.2rem;font-weight:800;line-height:1.3;text-wrap:balance}
.bz-card.big .bz-card-text{font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,8vw,2.4rem);line-height:1.1}
.bz-card.is-right{background:var(--good-soft);border-color:var(--good-ink)}
.bz-card.is-wrong{background:var(--bad-soft);border-color:var(--bad-ink)}
.bz-fix{color:var(--bad-ink);font-weight:700;font-size:.98rem}
.bz-note{color:var(--paper-mute);font-size:.95rem;line-height:1.4}
.bz-opts{display:grid;gap:10px}
.bz-opts.n2,.bz-opts.n4,.bz-opts.chips{grid-template-columns:1fr 1fr}
.bz-opt{font-weight:900}
.bz-opts.n2 .bz-opt,.bz-opts.n3 .bz-opt{justify-content:center;text-align:center;min-height:58px}
.bz-opts.n2 .qz-key,.bz-opts.chips .qz-key{display:none}
.bz-opts.chips .bz-opt{justify-content:center;text-align:center;font-size:.98rem;padding:.6em .4em}
.bz .bz-opt.side-allied{background:var(--side-allied);border-color:var(--side-allied);color:var(--paper-hi)}
.bz .bz-opt.side-central{background:var(--side-central);border-color:var(--side-central);color:var(--paper-hi)}
.bz .bz-opt.side-neutral{background:var(--c-x);border-color:var(--paper-mute);color:var(--ink)}
.bz .bz-opt.opt-yes{background:var(--brass);border-color:var(--brass-line);color:var(--brass-ink)}
.bz .bz-opt.opt-no{background:var(--c-x);border-color:var(--paper-mute);color:var(--ink)}
.bz .bz-opt.opt-l{background:var(--ink-3);border-color:var(--ink);color:var(--fg)}
.bz .bz-opt.opt-s{background:var(--c-s);border-color:var(--brass-line);color:var(--paper-ink)}
.bz .bz-opt.key-m,.cx-letter.key-m{background:var(--c-m)} .bz .bz-opt.key-a,.cx-letter.key-a{background:var(--c-a)}
.bz .bz-opt.key-i,.cx-letter.key-i{background:var(--c-i)} .bz .bz-opt.key-n,.cx-letter.key-n{background:var(--c-n)}
.bz .bz-opt.key-s,.cx-letter.key-s{background:var(--c-s)} .bz .bz-opt.key-x,.cx-letter.key-x{background:var(--c-x)}
.bz .bz-opt[class*="key-"]{color:var(--paper-ink);border-color:var(--paper-mute)}
.bz .bz-opt.is-right{background:var(--good-soft);border-color:var(--good-ink);color:var(--paper-ink);opacity:1;filter:none;box-shadow:0 0 0 3px var(--good-ink)}
.bz .bz-opt.is-wrong{background:var(--bad-soft);border-color:var(--bad-ink);color:var(--paper-ink);opacity:1;filter:none}
.bz-card.story{text-align:left;padding:14px}
.bz-story{margin:0;font-size:1.02rem;line-height:1.75}
.bz-blank{display:inline-block;min-width:4.5em;text-align:center;font-weight:900;border-bottom:2px solid currentColor;padding:0 .3em;line-height:1.3}
.bz-blank.cur{background:var(--brass);color:var(--brass-ink);border-radius:4px;border-bottom-color:var(--brass-line);animation:bz-pulse 1s ease-in-out infinite}
.bz-blank.ok{color:var(--good-ink)} .bz-blank.no{color:var(--bad-ink)}
@keyframes bz-pulse{50%{box-shadow:0 0 0 4px var(--paper-shade)}}
.bz-chain{display:flex;flex-direction:column;gap:8px}
.bz-chain-item .bz-num{border-radius:50%;opacity:1}
.bz .bz-chain-item.is-right{background:var(--good-soft);border-color:var(--good-ink);color:var(--paper-ink);opacity:1;filter:none;cursor:default}
.bz .bz-chain-item.is-right .bz-num{background:var(--good-ink);border-color:var(--good-ink);color:var(--paper-hi)}
.bz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bz-tile{min-height:54px;font-weight:900;font-size:1rem;padding:.5em .4em}
.bz .bz-tile.on{background:var(--brass);border-color:var(--brass-line);color:var(--brass-ink)}
.bz .bz-tile.is-right{background:var(--good-soft);border-color:var(--good-ink);color:var(--paper-ink);opacity:1;filter:none}
.bz .bz-tile.is-wrong{background:var(--bad-soft);border-color:var(--bad-ink);color:var(--paper-ink);opacity:1;filter:none;text-decoration:line-through}
.bz .bz-tile.is-missed{border:2px dashed var(--good-ink);color:var(--good-ink);opacity:1;filter:none}
.bz .bz-tile.is-dim{opacity:.35}
.bz-check{width:100%}
.bz-result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.bz-result .stamp{font-size:1.2rem}
.bz-score{font-size:3.2rem}
.bz-fixes{margin:0;padding-left:1.2em;text-align:left;align-self:stretch;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.bz-result .btn{width:100%}
@media (min-width:560px){
  .bz-opts.n3{grid-template-columns:repeat(3,1fr)}
  .bz-opts.chips,.bz-grid{grid-template-columns:repeat(3,1fr)}
}

/* ---------- practice test ---------- */
.pt .wrap{max-width:720px}
.pt-count{font-size:1.35rem}
.pt-card{border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.pt-inputs{display:grid;gap:10px}
.pt-input{width:100%;min-height:50px;font:800 1.1rem var(--font-body);padding:.6em .8em;border:2px solid var(--paper-line);border-radius:10px;
  background:var(--paper-hi);color:var(--paper-ink);user-select:text;-webkit-user-select:text}
.pt-input:focus{outline:3px solid var(--brass);outline-offset:1px}
.pt-input::placeholder{color:var(--paper-mute);opacity:.7;font-weight:600}
.pt-hint{font-size:.88rem}
.pt-scoreline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.pt-score{font-size:clamp(2.4rem,11vw,3.4rem)}
.pt-pct{font-family:var(--font-type);font-size:1.4rem;color:var(--paper-mute)}
.pt-msg{font-size:1.08rem;font-weight:800}
.pt-topics{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.pt-topic{display:flex;flex-direction:column;gap:4px;min-width:0}
.pt-topic-top{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:.95rem}
.pt-topic .bar>i{background:var(--good-ink)}
.pt-actions .btn{flex:1;font-size:1.12rem;padding:.8em .6em}
.pt-miss{display:flex;flex-direction:column;gap:4px;border-top:2px dashed var(--paper-line);padding-top:12px}
.pt-miss-q{font-weight:800}
.pt-miss-you{color:var(--bad-ink)}
.pt-miss-right b{color:var(--good-ink)}
.pt-miss-why{color:var(--paper-mute);font-size:.95rem}
@media (min-width:520px){.pt-inputs.multi{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.pt-topics{grid-template-columns:1fr}}

/* ---------- study notes ---------- */
.cx-screen{padding-top:0}
.cx.wrap{margin-block:0;gap:14px}
.cx-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;background:var(--ink);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.cx-h1{font-size:clamp(1.35rem,6vw,2.3rem)}
.cx-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--fg-mute)}
.cx-legend b{color:var(--brass);font-size:1.1rem}
.cx-dot{display:inline-block;width:.72em;height:.72em;border-radius:50%;border:2px solid currentColor;margin-right:.45em;opacity:.55;vertical-align:.02em;flex:none}
.cx-dot.b1,.cx-dot.b2{opacity:1;color:var(--brass-line);background:linear-gradient(90deg,var(--brass) 50%,transparent 50%)}
.cx-dot.b3,.cx-dot.b4,.cx-dot.b5{opacity:1;color:var(--good-ink);background:var(--good-ink)}
.cx-legend .cx-dot.b3{color:var(--good);background:var(--good)} .cx-legend .cx-dot.b1{color:var(--brass)}
.cx-sec{border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.cx-sec h2{font-size:clamp(1.3rem,5.4vw,1.8rem)}
.cx-sec p{margin:0}
.cx-lead{font-size:1.05rem;font-weight:700}
.cx-terms{display:grid;gap:14px}
.cx-term{display:flex;gap:12px;min-width:0}
.cx-letter{flex:none;width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-size:1.8rem;color:var(--paper-ink)}
.cx-term-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.cx-term-body h3{margin:0;font-size:1.2rem;font-weight:900;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cx-term-body .stamp{font-size:.68rem}
.cx-term-body .eyebrow{margin-right:.3em}
.cx-sub{margin:6px 0 0;font-size:1.08rem;font-weight:900;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cx-sides{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.cx-side{border:2px solid var(--paper-line);border-radius:12px;padding:12px;min-width:0}
.cx-side.central{border-color:var(--side-central)} .cx-side.allied{border-color:var(--side-allied)}
.cx-side h3{margin:0 0 6px;font-size:1.12rem;font-weight:900}
.cx-side h3 .mute{font-weight:700;font-size:.85rem}
.cx-side ul{margin:0;padding:0;list-style:none}
.cx-side li{padding:3px 0}
.cx-mn{font-family:var(--font-type);font-size:.95rem;line-height:1.5;background:var(--paper-shade);border-radius:8px;padding:8px 10px;margin-top:8px!important}
.cx-qa{margin:0;display:grid;gap:3px}
.cx-qa dt{font-weight:900;margin-top:8px}
.cx-qa dd{margin:0;line-height:1.5}
.cx-connect{display:flex;flex-direction:column;gap:10px}
.cx-connect .pill{vertical-align:.1em;margin-right:.2em}
.cx-story{line-height:1.9}
.cx-story mark{background:var(--brass);color:var(--brass-ink);font-weight:800;padding:.05em .3em;border-radius:4px;margin-right:.3em}
.cx-chain,.cx-ls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cx-chain li,.cx-ls li{display:flex;align-items:center;gap:10px}
.cx-n,.cx-badge{flex:none;width:2em;height:2em;display:grid;place-items:center;border-radius:50%;background:var(--c-s);color:var(--paper-ink);line-height:1}
.cx-badge{border-radius:7px;font-weight:900}
.cx-badge.l{background:var(--ink-3);color:var(--fg)}
@media (min-width:720px){.cx-terms{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.cx-sides{grid-template-columns:1fr}}

/* ===== meta.css ===== */
/* meta.css — title poster, agents, shop, achievements, stats, settings, results. All classes prefixed mt-. */
:root{
  --spark-core:#fff6cf;
  --mt-glow:rgba(242,187,61,.55);
  --mt-brass-deep:#9a6c08;
  --mt-shade:rgba(0,0,0,.34);
  --mt-veil-top:rgba(12,25,36,.3); --mt-veil-mid:rgba(12,25,36,.68); --mt-veil-bot:rgba(12,25,36,.92);
  --mt-good-ink:#1b7a4a;
}
.mt-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mt-wide{display:none}
@media (min-width:520px){.mt-wide{display:inline}.mt-narrow{display:none}}

/* ---- shared bits ---- */
.mt-wallet{display:inline-flex;align-items:center;gap:.4em;font-weight:900;font-size:1rem;line-height:1;white-space:nowrap;
  background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:.45em .8em}
.mt-cost{display:inline-flex;align-items:center;gap:.15em;font-weight:900;white-space:nowrap}
.bar>i.lv-lo{background:var(--stamp)} .bar>i.lv-mid{background:var(--brass)} .bar>i.lv-hi,.bar>i.lv-full{background:var(--good)}
.mt-av{display:inline-block;width:40px;height:40px;flex:none;line-height:0}
.mt-av.lg{width:60px;height:60px}
.mt-sec{margin:0;font-weight:400}
.mt-center{justify-content:center}

/* ---- TITLE: poster wordmark, brass PLAY, paper report card ---- */
.mt-title{background:linear-gradient(180deg,var(--mt-veil-top),var(--mt-veil-mid) 36%,var(--mt-veil-bot))}
.mt-title>.wrap{max-width:540px;gap:12px}
.mt-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mt-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:2px}
.mt-word{margin:0;display:flex;flex-direction:column;align-items:center;transform:rotate(-3deg);line-height:.86}
.mt-word b{display:block;font-family:var(--font-display);font-weight:400;letter-spacing:.02em}
.mt-word .w1{font-size:clamp(2.6rem,13vw,4.4rem);color:var(--fg);text-shadow:0 .06em 0 var(--stamp),0 .13em 0 var(--mt-shade)}
.mt-word .w2{position:relative;font-size:clamp(3.9rem,20vw,6.6rem);color:var(--brass);margin-top:.05em;
  text-shadow:0 .05em 0 var(--stamp),0 .11em 0 var(--mt-shade)}
.mt-word .stamp{position:absolute;right:100%;bottom:.2em;margin-right:.12em;font-size:clamp(.95rem,4vw,1.3rem);line-height:1;
  text-shadow:none;letter-spacing:.1em;transform:rotate(-13deg);background:var(--ink)}
.mt-fuse{position:absolute;left:100%;bottom:.44em;width:.42em;height:.5em;border:0 dashed var(--paper-2);
  border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:95% 95%}
.mt-fuse i{position:absolute;right:-12px;top:-15px;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle,var(--spark-core) 0 26%,var(--c-s) 48%,transparent 70%);
  box-shadow:0 0 18px 5px var(--c-s);animation:mt-flick .42s ease-in-out infinite alternate}
@keyframes mt-flick{from{transform:scale(.78) rotate(0deg);opacity:.85}to{transform:scale(1.22) rotate(25deg);opacity:1}}
.mt-pitch{margin:0;max-width:34ch;font-weight:700;line-height:1.3;text-wrap:balance}

.btn.mt-play{align-self:center;width:100%;max-width:400px;font-family:var(--font-display);font-weight:400;
  font-size:clamp(1.7rem,7.5vw,2.2rem);letter-spacing:.08em;padding:.4em 1em .44em;border-radius:18px;border-width:3px;
  box-shadow:0 6px 0 var(--mt-brass-deep);animation:mt-pulse 1.7s ease-out infinite}
.btn.mt-play:active{animation:none;transform:translateY(5px);box-shadow:0 1px 0 var(--mt-brass-deep)}
@keyframes mt-pulse{0%{box-shadow:0 6px 0 var(--mt-brass-deep),0 0 0 0 var(--mt-glow)}
  70%,100%{box-shadow:0 6px 0 var(--mt-brass-deep),0 0 0 16px transparent}}

.mt-setup{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.btn.mt-chip{flex:1 1 230px;max-width:400px;justify-content:flex-start;gap:10px;padding:6px 12px 6px 8px;text-align:left;
  background:var(--ink-2);min-height:56px}
.mt-chip .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;line-height:1.15}
.mt-chip .t b{font-weight:900;font-size:1rem}
.mt-chip .t span{font-size:.8rem;font-weight:600;color:var(--fg-mute)}
.mt-chip .go{font-family:var(--font-type);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.mt-danger{display:flex;align-items:center;gap:6px;background:var(--ink-2);border:2px solid var(--line);border-radius:12px;padding:5px 6px}
.mt-danger .btn{min-width:42px;font-size:1.2rem;padding:.2em .5em}
.mt-danger .v{min-width:156px;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.mt-danger .v b{color:var(--c-n);font-weight:900}
.mt-danger .v span{font-size:.74rem;color:var(--fg-mute)}

.mt-ready,.mt-res-ready{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.mt-ready-head{display:flex;align-items:center;gap:12px}
.mt-ready-title{font-family:var(--font-type);text-transform:uppercase;letter-spacing:.14em;font-size:.95rem;font-weight:700;line-height:1.2}
.mt-ready-sub{font-size:.8rem;font-weight:600;line-height:1.25;color:var(--paper-mute)}
.mt-ready-pct{font-size:clamp(2.1rem,10vw,2.9rem);line-height:.95;white-space:nowrap;color:var(--paper-ink)}
.mt-ready-pct.lv-lo{color:var(--stamp)} .mt-ready-pct.lv-hi,.mt-ready-pct.lv-full{color:var(--mt-good-ink)}
.mt-bar-big{height:18px}
.mt-topics{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.mt-topic{min-width:0;display:flex;flex-direction:column;gap:3px}
.mt-topic-row{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;font-weight:800;line-height:1.2}
.mt-topic .bar{height:8px}
.mt-ready-line{margin:0;font-size:.86rem;font-weight:700;line-height:1.3;color:var(--paper-mute)}

.mt-menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mt-menu .btn{flex-direction:column;gap:3px;padding:.5em .3em;font-size:.88rem;min-height:58px}
.mt-menu .ic{font-size:1.2rem;line-height:1}
.mt-menu2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mt-menu2 .btn{padding:.4em .3em;font-size:.8rem;min-height:44px;gap:.3em;flex-wrap:wrap}
.mt-count{opacity:.75;font-size:.9em}

/* ---- sub-screens ---- */
.mt-sub>.wrap{margin-block:0 auto}
.mt-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.mt-h1{font-size:clamp(1.6rem,7vw,2.2rem)}
@media (max-width:519px){.mt-head{grid-template-areas:"back . wallet" "title title title";gap:10px 12px}
  .mt-head>:nth-child(1){grid-area:back}.mt-head>:nth-child(2){grid-area:title}.mt-head>:nth-child(3){grid-area:wallet}}
.mt-h2{font-size:1.7rem;margin:4px 0 12px}
.mt-lead{margin:0;max-width:65ch}

.mt-card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mt-card-name{margin:0;font-size:1.08rem;font-weight:900;line-height:1.15}
.mt-card-desc{margin:0;font-size:.92rem;line-height:1.35;color:var(--fg-mute)}
.mt-card-foot{margin-top:auto;padding-top:4px;display:flex}
.mt-card-foot .btn{flex:1}
.mt-card.is-sel{border-color:var(--brass);box-shadow:inset 0 0 0 2px var(--brass)}
.btn.mt-cant{opacity:.6}
.mt-state{flex:1;border-radius:12px;padding:.55em .8em;min-height:44px;display:flex;flex-direction:column;justify-content:center;font-size:.86rem;line-height:1.25}
.mt-state.sel{align-items:center;color:var(--brass);border:2px dashed var(--brass);font-family:var(--font-type);text-transform:uppercase;letter-spacing:.12em}
.mt-state.lock{background:var(--mt-shade);color:var(--fg-mute)}
.mt-state.lock b{color:var(--fg)}

.mt-chargrid{grid-template-columns:repeat(auto-fit,minmax(min(205px,100%),1fr))}
.mt-char-top{display:flex;gap:12px;align-items:center}
.mt-char-tag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;margin-top:5px}
.mt-weapon{display:flex;flex-direction:column;gap:1px;font-size:.88rem;line-height:1.3}
.mt-mods{display:flex;flex-wrap:wrap;gap:6px}
.mt-mod{font-size:.78rem;font-weight:800;line-height:1.2;padding:.25em .65em;border-radius:999px;border:1px solid var(--line);color:var(--fg-mute)}
.mt-mod.up{border-color:var(--good);color:var(--good)} .mt-mod.down{border-color:var(--bad);color:var(--bad)}
.mt-char.is-locked .mt-av{filter:grayscale(.75) brightness(.8)}

.mt-shopgrid{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
.mt-up-top{display:flex;gap:12px;align-items:center}
.mt-icon{font-size:1.6rem;line-height:1;width:46px;height:46px;display:grid;place-items:center;background:var(--ink-3);border-radius:12px;flex:none}
.mt-pips{display:flex;gap:4px;margin-top:6px}
.mt-pips i{width:18px;height:7px;border-radius:3px;background:var(--mt-shade);border:1px solid var(--line)}
.mt-pips i.on{background:var(--brass);border-color:var(--brass)}
.mt-effect{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:.88rem;font-weight:700}
.mt-effect .now,.mt-effect .arrow{color:var(--fg-mute)}
.mt-effect b{color:var(--good);font-weight:900}

.mt-achgrid{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.mt-ach{padding:12px;gap:6px}
.mt-ach-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mt-ach-top .stamp{font-size:.68rem;flex:none;color:var(--good);border-color:var(--good)}
.mt-ach-top .mt-cost{color:var(--brass);font-size:.9rem}

<body>
<div id="app"><canvas id="game-canvas"></canvas><div id="hud" hidden></div><div id="screens"></div><div id="modals"></div><div id="toasts"></div></div>
<script>
/* ===== core.js ===== */
/* core.js — tiny shared helpers. Exposes window.U and window.Toast. */
(function () {
  'use strict';
  const U = {
    $: (s, r) => (r || document).querySelector(s),
    $$: (s, r) => Array.from((r || document).querySelectorAll(s)),
    /* U.el('div', {class:'x', html:'<b>hi</b>', text:'..', onclick:fn, dataset:{k:v}, style:{k:v}, hidden:true}, ...children) */
    el(tag, attrs, ...kids) {
      const e = document.createElement(tag);
      if (attrs) for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k === 'text') e.textContent = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k === 'dataset') Object.assign(e.dataset, v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
        else if (v === true) e.setAttribute(k, '');
        else e.setAttribute(k, v);
      }
      const add = (c) => {
        if (c == null || c === false) return;
        if (Array.isArray(c)) c.forEach(add);
        else e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
      };
      kids.forEach(add);
      return e;
    },
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; },
    fmtTime(sec) { sec = Math.max(0, Math.floor(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; },
    fmtNum(n) { n = Math.round(n); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(n); },
    esc: (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    isTouch: () => ('ontouchstart' in window) || navigator.maxTouchPoints > 0,
  };
  window.U = U;

  /* Toast.show('<b>Saved</b>', {kind:'good'|'bad'|'', ms:2200}) */
  window.Toast = {
    show(html, opts) {
      opts = opts || {};
      const root = document.getElementById('toasts');
      if (!root) return;
      const t = U.el('div', { class: 'toast ' + (opts.kind || ''), html });
      root.appendChild(t);
      while (root.children.length > 3) root.removeChild(root.firstChild);
      setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, opts.ms || 2200);
    },
  };
})();

/* ===== save.js ===== */
/* save.js — the ONLY module that touches localStorage. Exposes window.Save.
   Each module keeps its own namespace:  const S = Save.ns('quiz', {mastery:{}, streak:0});  ...mutate S...  Save.commit(); */
(function () {
  'use strict';
  const KEY = 'powderkeg1914.save.v1';
  let timer = null;
  const clone = (v) => (v && typeof v === 'object' ? JSON.parse(JSON.stringify(v)) : v);
  const Save = {
    data: {},
    load() {
      try { const s = localStorage.getItem(KEY); const d = s ? JSON.parse(s) : null; this.data = d && typeof d === 'object' ? d : {}; }
      catch (e) { this.data = {}; }
      return this.data;
    },
    /* get-or-create a namespace object, filling in any missing default keys (shallow) */
    ns(name, defaults) {
      let d = this.data[name];
      if (!d || typeof d !== 'object') d = this.data[name] = {};
      if (defaults) for (const k in defaults) if (!(k in d)) d[k] = clone(defaults[k]);
      return d;
    },
    /* debounced write */
    commit() { if (timer) return; timer = setTimeout(() => { timer = null; this.flush(); }, 400); },
    flush() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* storage unavailable: play on without saving */ } },
    /* wipe everything (settings screen). Caller should reload its own state afterwards. */
    reset() { this.data = {}; try { localStorage.removeItem(KEY); } catch (e) {} },
  };
  Save.load();
  /* shared settings namespace used by audio + game + settings screen */
  Save.ns('settings', { music: 0.55, sfx: 0.8, muted: false, shake: true, dmgNumbers: true });
  window.addEventListener('pagehide', () => Save.flush());
  document.addEventListener('visibilitychange', () => { if (document.hidden) Save.flush(); });
  window.Save = Save;
})();

/* ===== audio.js ===== */
/* audio.js — procedural WebAudio for Powder Keg 1914: SFX + a little step sequencer for music. Zero assets.
   Exposes window.AudioSys (see SPEC "AudioSys"). Every call is a silent no-op when WebAudio is unavailable. */
(function () {
  'use strict';
  const AC = window.AudioContext || window.webkitAudioContext;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);

  /* ------------------------------------------------------------------ state */
  const DEF_SET = { music: 0.55, sfx: 0.8, muted: false };
  const localSet = Object.assign({}, DEF_SET);
  let inited = false, dead = !AC, eng = null, userUnlocked = false, timer = null;
  let wantTrack = null, curTrack = null, ducked = false;
  const players = [];            // live music players (sequencers, buffer loops, stingers)
  const ext = {};                // external tracks: key -> {raw:ArrayBuffer|null, buf:AudioBuffer|null, gain}
  const LOOKAHEAD = 0.35;

  function S() { try { if (window.Save && Save.ns) return Save.ns('settings', DEF_SET); } catch (e) {} return localSet; }
  function persist() { try { if (window.Save && Save.commit) Save.commit(); } catch (e) {} }

  /* ------------------------------------------------------------------ engine (works for live + offline contexts) */
  function makeEngine(ctx) {
    const E = { ctx, voices: 0, sfxVoices: 0, offline: false, waves: {} };
    E.master = ctx.createGain();
    E.comp = ctx.createDynamicsCompressor();
    try { E.comp.threshold.value = -15; E.comp.knee.value = 12; E.comp.ratio.value = 8; E.comp.attack.value = 0.003; E.comp.release.value = 0.18; } catch (e) {}
    E.sfxBus = ctx.createGain();
    E.musicBus = ctx.createGain();
    E.duckGain = ctx.createGain();
    E.musicFilter = ctx.createBiquadFilter(); E.musicFilter.type = 'lowpass'; E.musicFilter.frequency.value = 18000; E.musicFilter.Q.value = 0.5;
    E.musicBus.connect(E.duckGain); E.duckGain.connect(E.musicFilter); E.musicFilter.connect(E.comp);
    E.sfxBus.connect(E.comp); E.comp.connect(E.master); E.master.connect(ctx.destination);
    const len = Math.floor(ctx.sampleRate * 1.2), nb = ctx.createBuffer(1, len, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;      // white noise, rendered once
    E.noise = nb;
    [['p25', 0.25], ['p12', 0.125]].forEach((w) => {                 // NES-style pulse waves
      const N = 20, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
      for (let k = 1; k <= N; k++) re[k] = (4 / (k * Math.PI)) * Math.sin(k * Math.PI * w[1]);
      try { E.waves[w[0]] = ctx.createPeriodicWave(re, im); } catch (e) {}
    });
    return E;
  }
  function setWave(E, osc, type) {
    const w = E.waves[type];
    if (w) osc.setPeriodicWave(w); else osc.type = (type === 'p25' || type === 'p12') ? 'square' : (type || 'sine');
  }
  function applyLevels(E, instant) {
    const s = S(), t = E.ctx.currentTime;
    const set = (p, v) => { if (instant) p.value = v; else { try { p.setTargetAtTime(v, t, 0.04); } catch (e) { p.value = v; } } };
    set(E.musicBus.gain, Math.pow(clamp(num(s.music, 0.55), 0, 1), 1.5) * 0.8);
    set(E.sfxBus.gain, Math.pow(clamp(num(s.sfx, 0.8), 0, 1), 1.3) * 0.9);
    set(E.master.gain, s.muted ? 0 : 1);
    set(E.duckGain.gain, ducked ? 0.4 : 1);
    set(E.musicFilter.frequency, ducked ? 850 : 18000);
  }
  /* voice bookkeeping + cleanup */
  function reg(E, src, nodes, isSfx) {
    E.voices++; if (isSfx) E.sfxVoices++;
    src.onended = () => {
      E.voices--; if (isSfx) E.sfxVoices--;
      for (let i = 0; i < nodes.length; i++) { try { nodes[i].disconnect(); } catch (e) {} }
    };
  }

  /* ------------------------------------------------------------------ synth primitives */
  /* tone: o = {type,f,f2,slide,dur,vol,a,hold,lp,dest} — osc with pitch slide + percussive envelope */
  function tone(E, t, o) {
    if (!(o.vol > 0)) return;
    const ctx = E.ctx, osc = ctx.createOscillator(), g = ctx.createGain(), sfx = !o.dest;
    setWave(E, osc, o.type);
    osc.frequency.setValueAtTime(clamp(o.f, 20, 12000), t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(clamp(o.f2, 20, 12000), t + (o.slide || o.dur));
    const a = o.a == null ? 0.004 : o.a;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol, t + a);
    if (o.hold) g.gain.setValueAtTime(o.vol, t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(o.dur, a + (o.hold || 0) + 0.01));
    const nodes = [g];
    if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = 0.7; osc.connect(f); f.connect(g); nodes.push(f); }
    else osc.connect(g);
    g.connect(o.dest || E.sfxBus);
    osc.start(t); osc.stop(t + o.dur + 0.03);
    reg(E, osc, nodes, sfx);
  }
  /* noise: o = {type(filter),f,f2,f3,q,dur,vol,a,rate,dest} — filtered noise burst with optional filter sweep */
  function noise(E, t, o) {
    if (!(o.vol > 0)) return;
    const ctx = E.ctx, src = ctx.createBufferSource(), g = ctx.createGain(), sfx = !o.dest;
    src.buffer = E.noise; src.loop = true; if (o.rate) src.playbackRate.value = o.rate;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7;
    f.frequency.setValueAtTime(clamp(o.f || 1000, 20, 16000), t);
    if (o.f2 && o.f3) { f.frequency.exponentialRampToValueAtTime(clamp(o.f2, 20, 16000), t + o.dur * 0.45); f.frequency.exponentialRampToValueAtTime(clamp(o.f3, 20, 16000), t + o.dur); }
    else if (o.f2) f.frequency.exponentialRampToValueAtTime(clamp(o.f2, 20, 16000), t + o.dur);
    const a = o.a == null ? 0.003 : o.a;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(o.dur, a + 0.01));
    src.connect(f); f.connect(g); g.connect(o.dest || E.sfxBus);
    src.start(t, Math.random()); src.stop(t + o.dur + 0.03);
    reg(E, src, [g, f], sfx);
  }
  /* run of notes: midi list, fixed step; the last note rings for o.last seconds */
  function run(E, t, midis, step, o, p) {
    for (let i = 0; i < midis.length; i++) {
      tone(E, t + i * step, { type: o.type, f: mtof(midis[i]) * (p || 1), dur: i === midis.length - 1 ? (o.last || o.dur) : o.dur, vol: o.vol, lp: o.lp, a: o.a });
    }
  }

  /* ------------------------------------------------------------------ SFX   fn(E, t, p = pitch mult, v = volume mult) */
  const SFX = {
    shoot(E, t, p, v) { tone(E, t, { type: 'p25', f: 860 * p * rnd(0.96, 1.04), f2: 400 * p, dur: 0.07, vol: 0.075 * v }); },
    hit(E, t, p, v) {
      noise(E, t, { type: 'bandpass', f: 2100 * p, q: 1.1, dur: 0.045, vol: 0.13 * v });
      tone(E, t, { type: 'triangle', f: 240 * p * rnd(0.9, 1.1), f2: 150 * p, dur: 0.05, vol: 0.1 * v });
    },
    crit(E, t, p, v) {
      tone(E, t, { type: 'p25', f: 1200 * p, f2: 1850 * p, dur: 0.07, vol: 0.07 * v });
      noise(E, t, { type: 'highpass', f: 4200, dur: 0.06, vol: 0.1 * v });
      tone(E, t, { type: 'triangle', f: 330 * p, f2: 150 * p, dur: 0.09, vol: 0.15 * v });
    },
    kill(E, t, p, v) {
      tone(E, t, { type: 'sine', f: 540 * p * rnd(0.9, 1.1), f2: 105 * p, dur: 0.1, vol: 0.2 * v });
      noise(E, t, { type: 'lowpass', f: 3200, f2: 500, dur: 0.06, vol: 0.07 * v });
    },
    hurt(E, t, p, v) {
      tone(E, t, { type: 'sawtooth', f: 235 * p, f2: 78 * p, dur: 0.24, vol: 0.2 * v, lp: 900 });
      noise(E, t, { type: 'lowpass', f: 950, f2: 140, dur: 0.17, vol: 0.24 * v });
    },
    pickup(E, t, p, v) { tone(E, t, { type: 'triangle', f: 900 * p, f2: 1350 * p, dur: 0.055, vol: 0.1 * v }); },
    coin(E, t, p, v) {
      tone(E, t, { type: 'p25', f: mtof(83) * p, dur: 0.06, vol: 0.05 * v, lp: 5200 });
      tone(E, t + 0.055, { type: 'p25', f: mtof(88) * p, dur: 0.17, vol: 0.05 * v, lp: 5200 });
    },
    levelup(E, t, p, v) {
      run(E, t, [72, 76, 79, 84], 0.075, { type: 'p25', dur: 0.11, last: 0.42, vol: 0.085 * v, lp: 4200 }, p);
      run(E, t, [60, 64, 67, 72], 0.075, { type: 'triangle', dur: 0.11, last: 0.42, vol: 0.13 * v }, p);
      noise(E, t + 0.22, { type: 'highpass', f: 6500, dur: 0.35, vol: 0.035 * v, a: 0.02 });
    },
    correct(E, t, p, v) {
      tone(E, t, { type: 'sine', f: mtof(81) * p, dur: 0.14, vol: 0.2 * v });
      tone(E, t + 0.09, { type: 'sine', f: mtof(88) * p, dur: 0.42, vol: 0.22 * v });
      tone(E, t + 0.09, { type: 'triangle', f: mtof(100) * p, dur: 0.3, vol: 0.045 * v });
    },
    wrong(E, t, p, v) {
      tone(E, t, { type: 'triangle', f: mtof(55) * p, dur: 0.15, vol: 0.15 * v, hold: 0.07 });
      tone(E, t + 0.13, { type: 'triangle', f: mtof(51) * p, dur: 0.26, vol: 0.15 * v, hold: 0.1 });
      tone(E, t, { type: 'square', f: mtof(43) * p, dur: 0.36, vol: 0.035 * v, lp: 420, hold: 0.2 });
    },
    click(E, t, p, v) { tone(E, t, { type: 'p25', f: 720 * p, dur: 0.035, vol: 0.08 * v }); },
    select(E, t, p, v) { tone(E, t, { type: 'triangle', f: 520 * p, f2: 800 * p, dur: 0.06, vol: 0.11 * v }); },
    chest(E, t, p, v) {
      run(E, t, [72, 74, 76, 79, 81, 84, 88], 0.045, { type: 'p25', dur: 0.08, last: 0.4, vol: 0.07 * v, lp: 4500 }, p);
      run(E, t + 0.3, [72, 76, 79], 0, { type: 'triangle', dur: 0.5, vol: 0.08 * v }, p);
      noise(E, t, { type: 'highpass', f: 6000, dur: 0.5, vol: 0.04 * v, a: 0.05 });
    },
    boss_warn(E, t, p, v) {
      for (let i = 0; i < 4; i++) tone(E, t + i * 0.3, { type: 'square', f: (i % 2 ? 370 : 277) * p, dur: 0.26, vol: 0.11 * v, lp: 1400, hold: 0.16 });
      noise(E, t, { type: 'lowpass', f: 220, dur: 1.25, vol: 0.15 * v, a: 0.1 });
    },

  function readiness() {
    let r = null;

    const t = r.byTopic || {};
    return {
      overall: Math.round(U.clamp(n0(r.overall), 0, 100)),
      byTopic: { vocab: Math.round(n0(t.vocab)), sides: Math.round(n0(t.sides)), compete: Math.round(n0(t.compete)), spark: Math.round(n0(t.spark)) },
      mastered: n0(r.mastered), total: n0(r.total), seen: n0(r.seen),

  function qstats() {

  }
  function ctx() {
    const st = Object.assign({}, M.stats);
    STAT_KEYS.forEach((k) => { st[k] = n0(st[k]); });

    let up = 0; for (const k in M.up) up += n0(M.up[k]);

    maxHp: (v) => [(v > 0 ? '+' : '') + v + ' max HP', v > 0],

  /* --------------------------------------------------- coins, unlocks, achievements */
  function addCoins(n) {
    n = Math.round(n0(n)); if (!n) return M.coins;
    M.coins = Math.max(0, M.coins + n); if (n > 0) M.totalCoins += n;
    Save.commit(); refreshWallets();
    return M.coins;
  }
  function featMet(feat, c) {
    if (feat === 'win') return c.st.wins > 0;
    if (feat === 'ready80') return c.r >= 80;
    if (feat === 'test90') return c.q.practiceBest >= 90;
    return false;
  }
  function featProgress(feat, c) {
    if (feat === 'ready80') return 'Now ' + c.r + '% of 80%';
    if (feat === 'test90') return c.q.practiceCount ? 'Best so far ' + c.q.practiceBest + '%' : 'No tests taken yet';
    if (feat === 'win') return c.st.bestAct ? 'Furthest so far: Act ' + c.st.bestAct : 'Beat all five acts';
    return '';
  }
  function checkUnlocks(silent) {
    const c = ctx(), got = [];
    for (const ch of CHARS) {
      if (M.chars[ch.id] || ch.unlock.type !== 'feat') continue;
      if (featMet(ch.unlock.feat, c)) { M.chars[ch.id] = true; got.push(ch); }
    }
    if (got.length) {
      Save.commit();
      if (!silent) got.forEach((ch, i) => setTimeout(() => { toast('New character unlocked: <b>' + U.esc(ch.name) + '</b>', { kind: 'good', ms: 3200 }); sfx('unlock'); }, 300 + i * 900));
    }
    return got;
  }
  function checkAchievements(silent) {
    const c = ctx(), got = [];
    for (const a of ACH) {
      if (M.ach[a.id]) continue;
      const p = a.prog(c);
      if (p[0] >= p[1]) { M.ach[a.id] = Date.now(); M.coins += a.coins; M.totalCoins += a.coins; got.push(a); }
    }
    if (got.length) {
      Save.commit(); refreshWallets();
      if (!silent) got.slice(0, 4).forEach((a, i) => setTimeout(() => {
        toast('Achievement: <b>' + U.esc(a.name) + '</b> +' + a.coins + ' coins', { kind: 'good', ms: 2800 }); sfx('unlock');
      }, 200 + i * 800));
    }
    return got;
  }
  /* unlocks first: the Full Squad achievement counts them */
  function checkAll(silent) {
    const chars = checkUnlocks(silent);
    const ach = checkAchievements(silent);
    return { chars, ach };
  }

  /* ------------------------------------------------------------- bonuses */
  function bonuses() {
    const b = { maxHp: 0, dmgMult: 1, speedMult: 1, magnetMult: 1, xpMult: 1, coinMult: 1, armor: 0, regen: 0, cooldownMult: 1, crit: 0, revives: 0, rerolls: 0 };
    if (!M) return b;
    for (const t of SHOP) { const l = U.clamp(n0(M.up[t.id]) | 0, 0, t.max); if (l > 0) t.apply(b, l); }
    const mods = charById(M.char).mods;
    for (const k in mods) { if (!(k in b)) continue; if (/Mult$/.test(k)) b[k] *= mods[k]; else b[k] += mods[k]; }
    return b;
  }
  function character() {
    const c = charById(M ? M.char : 'cadet');
    return { id: c.id, name: c.name, title: c.title, desc: c.desc, color: c.color, hat: c.hat, startWeapon: c.startWeapon, mods: Object.assign({}, c.mods) };
  }

    set(H.lv, 'lv', p.level, (e, v) => { e.textContent = 'LEVEL ' + v; });
    set(H.hp, 'hp', Math.round(p.hp / p.maxHp * 100), (e, v) => { e.style.width = v + '%'; e.className = v < 30 ? 'low' : ''; });
    set(H.hpT, 'hpt', Math.ceil(p.hp) + ' / ' + p.maxHp, (e, v) => { e.textContent = v; });
    set(H.time, 'time', Math.floor(g.t), (e, v) => { e.textContent = U.fmtTime(v); });
    set(H.coins, 'coins', g.coins, (e, v) => { e.textContent = v; });
    set(H.kills, 'kills', g.kills, (e, v) => { e.textContent = v + ' KO'; });
    set(H.streak, 'streak', g.streak, (e, v) => { e.hidden = v < 2; e.textContent = 'ANSWER STREAK x' + v; });
    const bs = g.bosses, on = bs.length > 0;
    set(H.boss, 'bossOn', on, (e, v) => { e.hidden = !v; if (v) { H.bossN.textContent = g.actDef.bossName; H.boss.style.setProperty('--bc', g.actDef.color); } });
    if (on) {
      let hp = 0, mx = 0, sh = false; for (const b of bs) { hp += Math.max(0, b.hp); mx += b.maxHp; if (b.shield) sh = true; }
      set(H.bossB, 'bossHp', Math.round(hp / mx * 300), (e, v) => { e.style.width = v / 3 + '%'; });
      set(H.bossB, 'bossSh', sh, (e, v) => { e.className = v ? 'sh' : ''; });
      const f = bs[0].fuse; set(H.fuse, 'fuseOn', f !== undefined, (e, v) => { e.hidden = !v; });
      if (f !== undefined) set(H.fuseB, 'fuse', Math.round(f / bs[0].fuseMax * 200), (e, v) => { e.style.width = v / 2 + '%'; });
    }
  }

  /* ================= input ================= */
  const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
  function onKeyDown(e) {
    const k = KEYMAP[e.code];
    if (k) { keys[k] = true; if (g.state === 'play' && !g.busy && !g.paused) e.preventDefault(); }
    else if ((e.code === 'Escape' || e.code === 'KeyP') && g.state === 'play') { if (g.paused) resume(); else if (!g.busy) pause(); }
  }
  function onKeyUp(e) { const k = KEYMAP[e.code]; if (k) keys[k] = false; }
  function pt(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function pDown(e) { if (g.state !== 'play' || g.busy || g.paused || g.joy.on) return; const q = pt(e); g.joy.on = true; g.joy.id = e.pointerId; g.joy.ox = g.joy.x = q[0]; g.joy.oy = g.joy.y = q[1]; try { cv.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); }
  function pMove(e) { if (!g.joy.on || e.pointerId !== g.joy.id) return; const q = pt(e); g.joy.x = q[0]; g.joy.y = q[1]; const dx = q[0] - g.joy.ox, dy = q[1] - g.joy.oy, d = Math.hypot(dx, dy); if (d > 70) { g.joy.ox += dx / d * (d - 70); g.joy.oy += dy / d * (d - 70); } }
  function pUp(e) { if (e.pointerId === g.joy.id) g.joy.on = false; }

  /* ================= public ================= */
  function start(o) {
    o = o || {}; const keep = { W: g.W, H: g.H, dpr: g.dpr, scale: g.scale, vw: g.vw, vh: g.vh }; closeMine();
    g = blank(); Object.assign(g, keep); g.opts = o; g.danger = Math.max(0, o.danger | 0); const d = g.danger;
    g.mult = { hp: 1 + 0.4 * d, dmg: 1 + 0.15 * d, spd: 1 + 0.03 * d, spawn: 1 + 0.1 * d };
    const bon = Object.assign({ maxHp: 0, dmgMult: 1, speedMult: 1, magnetMult: 1, xpMult: 1, coinMult: 1, armor: 0, regen: 0, cooldownMult: 1, crit: 0, revives: 0, rerolls: 0 }, window.Meta && Meta.bonuses ? Meta.bonuses() : {});
    const ch = Object.assign({ id: 'cadet', name: 'Time Cadet', color: '#e9b949', hat: 'cap', startWeapon: 'blaster' }, (window.Meta && Meta.character ? Meta.character() : null) || {});
    g.player = newPlayer(ch, bon); g.state = 'play'; g.act = Math.max(0, Math.min(ACTS.length - 1, o.act | 0)); g.actDef = ACTS[g.act]; g.maxAct = g.act + 1; g.cap = U.isTouch() ? 170 : 220;
    for (const k in HV) delete HV[k]; hudShow(true); hudAct(); hudWeps(); music(g.actDef.music);
    banner('ACT ' + g.actDef.n + ' · ' + g.actDef.name, g.actDef.def, g.actDef.color, g.actDef.key === 'S' ? '⚡' : g.actDef.key, 5600);
    text(0, 64, U.isTouch() ? 'Drag anywhere to move' : 'Move with WASD or the arrow keys', '#ffffff', 15, 4.5);
    last = performance.now();
    try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  }
  function init() {
    cv = document.getElementById('game-canvas'); modalRoot = document.getElementById('modals');
    R.init(cv); g = blank(); R.resize(g); buildHud(); hudShow(false); seedDeco();
    window.addEventListener('resize', () => R.resize(g));
    window.addEventListener('keydown', onKeyDown); window.addEventListener('keyup', onKeyUp); window.addEventListener('blur', () => { keys = {}; g.joy.on = false; });
    cv.addEventListener('pointerdown', pDown); cv.addEventListener('pointermove', pMove); cv.addEventListener('pointerup', pUp); cv.addEventListener('pointercancel', pUp);
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else last = performance.now(); });
    last = performance.now(); requestAnimationFrame(frame);
  }
  window.Game = {
    init, start, pause, resume,
    isRunning: () => !!g && g.state === 'play',
    debug: { state: () => g, opts: DBG, give(id) { apply({ kind: WD[id] ? 'w' : 'p', id, lvl: 1 }); }, skip() { g.actT = g.actDef.len - 4.5; }, xp(n) { addXp(n); }, hurt(n) { hitPlayer(n, true); } },
  };
})();


(function () {
  function step(name, fn) { try { fn(); } catch (e) { console.error('[boot] ' + name, e); } }
  function boot() {
    step('audio', function () { window.AudioSys && AudioSys.init(); });
    step('quiz', function () { window.Quiz && Quiz.init(); });
    step('meta', function () { window.Meta && Meta.init(); });
    step('game', function () { Game.init(); });
    step('title', function () { if (window.Meta) Meta.showTitle(); else Game.start({}); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
